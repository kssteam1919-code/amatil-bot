<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
    <title>AMATIL VAPE • премиум вейп-шоп</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #f9f7f4; --surface: rgba(255,255,255,0.8); --text: #2d2d2d; --text-light: #5e5e5e; --accent: #4a9e8c; --accent-hover: #3b8272; --shadow: 0 12px 28px rgba(0,0,0,0.06); --radius: 24px; }
        body { background: var(--bg); font-family: 'Montserrat', sans-serif; min-height: 100vh; overflow-x: hidden; color: var(--text); display: flex; flex-direction: column; align-items: center; position: relative; }
        body::before { content: ""; position: fixed; top:0;left:0;width:100%;height:100%; background: radial-gradient(circle at 20% 30%, rgba(74,158,140,0.06) 0%, transparent 60%), radial-gradient(circle at 80% 70%, rgba(107,181,165,0.04) 0%, transparent 50%); pointer-events: none; z-index:0; }
        .main-wrapper { position: relative; z-index:2; width:100%; max-width:1200px; padding:0 2rem; display:flex; flex-direction:column; min-height:100vh; }
        .welcome-overlay { position: fixed; top:0;left:0;width:100%;height:100%; background:#f2ede8; z-index:1000; display:flex; align-items:center; justify-content:center; flex-direction:column; transition: opacity 1.2s ease; opacity:1; }
        .welcome-overlay.fade-out { opacity:0; pointer-events:none; }
        .welcome-content { text-align:center; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
        .welcome-logo { font-family: 'Playfair Display', serif; font-size:4.8rem; font-weight:700; letter-spacing:10px; color:#2d2d2d; margin-bottom:1rem; }
        .welcome-logo span { color:var(--accent); }
        .welcome-text { font-size:1.4rem; font-weight:300; letter-spacing:5px; color:#5e5e5e; margin-bottom:3rem; }
        .welcome-btn { background:transparent; border:2px solid var(--accent); color:var(--accent); font-weight:600; font-size:1.1rem; letter-spacing:4px; padding:1rem 3.5rem; border-radius:50px; cursor:pointer; transition:0.3s; background:rgba(255,255,255,0.4); }
        .welcome-btn:hover { background:var(--accent); color:#fff; }
        header { display:flex; align-items:center; justify-content:space-between; padding:2rem 0; flex-wrap:wrap; gap:1.5rem; border-bottom:1px solid rgba(0,0,0,0.05); margin-bottom:2rem; }
        .logo { font-family:'Playfair Display',serif; font-size:2.3rem; font-weight:700; letter-spacing:6px; color:#2d2d2d; }
        .logo span { color:var(--accent); }
        .nav-links { display:flex; gap:2.5rem; align-items:center; }
        .nav-links a { font-weight:500; font-size:0.9rem; letter-spacing:1.5px; color:#5e5e5e; text-decoration:none; text-transform:uppercase; border-bottom:2px solid transparent; transition:0.3s; padding-bottom:4px; }
        .nav-links a:hover { color:var(--accent); border-bottom-color:var(--accent); }
        .cart-icon { position:relative; background:none; border:none; font-size:1.9rem; cursor:pointer; color:#2d2d2d; }
        #cart-count { position:absolute; top:-8px; right:-12px; background:#e06b6b; color:white; border-radius:50%; width:22px; height:22px; font-size:0.75rem; display:flex; align-items:center; justify-content:center; font-weight:700; }
        .hero { text-align:center; padding:3rem 0 5rem; }
        .hero h1 { font-family:'Playfair Display',serif; font-size:4rem; font-weight:700; letter-spacing:3px; color:#2d2d2d; margin-bottom:0.8rem; }
        .hero .subtitle { font-size:1.2rem; font-weight:400; letter-spacing:5px; color:#5e5e5e; text-transform:uppercase; margin-bottom:2.5rem; }
        .cta-button { background:var(--accent); border:none; color:#fff; font-weight:600; font-size:1rem; letter-spacing:3px; padding:1rem 3.2rem; border-radius:50px; text-decoration:none; display:inline-block; transition:0.3s; }
        .cta-button:hover { background:var(--accent-hover); }
        .products-section { padding:3rem 0; margin:2rem 0 4rem; }
        .section-title { text-align:center; font-family:'Playfair Display',serif; font-size:2.8rem; font-weight:700; letter-spacing:4px; color:#2d2d2d; margin-bottom:3rem; }
        .product-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:3rem; }
        .product-card { background:var(--surface); backdrop-filter:blur(20px); border-radius:var(--radius); padding:2.2rem 1.8rem; width:290px; text-align:center; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.7); transition:0.4s; display:flex; flex-direction:column; align-items:center; }
        .product-card:hover { transform:translateY(-8px); box-shadow:0 25px 45px rgba(0,0,0,0.12); }
        .product-img { width:160px; height:160px; object-fit:contain; margin-bottom:1.5rem; border-radius:18px; background:#f0ede8; padding:10px; }
        .product-name { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; margin-bottom:0.4rem; }
        .product-desc { color:#6b6b6b; font-size:0.9rem; margin-bottom:0.8rem; }
        .product-price { font-size:2rem; font-weight:600; color:var(--accent); margin:0.6rem 0; }
        .stock-info { font-size:0.85rem; color:#7a7a7a; margin-bottom:1.3rem; background:rgba(0,0,0,0.03); padding:0.35rem 1.2rem; border-radius:20px; display:inline-block; }
        .buy-btn { background:white; border:2px solid var(--accent); color:var(--accent); font-weight:600; font-size:0.95rem; letter-spacing:2px; padding:0.75rem 2.2rem; border-radius:35px; cursor:pointer; transition:0.3s; text-transform:uppercase; margin-top:auto; }
        .buy-btn:hover:not(:disabled) { background:var(--accent); color:#fff; }
        .buy-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .cart-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.35); backdrop-filter:blur(6px); z-index:200; align-items:center; justify-content:center; }
        .cart-modal.open { display:flex; }
        .cart-dialog { background:rgba(255,255,255,0.92); backdrop-filter:blur(25px); border-radius:32px; padding:2.2rem; width:90%; max-width:480px; max-height:85vh; overflow-y:auto; box-shadow:0 35px 60px rgba(0,0,0,0.2); position:relative; }
        .cart-close { position:absolute; top:18px; right:22px; background:none; border:none; font-size:2rem; color:#888; cursor:pointer; }
        .cart-title { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:1.8rem; text-align:center; }
        .cart-items { display:flex; flex-direction:column; gap:1rem; margin-bottom:1.8rem; }
        .cart-item { display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.02); padding:0.8rem; border-radius:16px; }
        .cart-item img { width:45px; height:45px; object-fit:contain; border-radius:10px; margin-right:1rem; background:#f0ede8; }
        .cart-item-info { flex:1; }
        .cart-item-name { font-weight:600; font-size:0.95rem; }
        .cart-item-price { color:var(--accent); font-size:0.85rem; }
        .cart-item-actions { display:flex; align-items:center; gap:0.7rem; }
        .cart-item-qty { font-weight:600; color:#444; background:rgba(0,0,0,0.05); padding:0.2rem 0.6rem; border-radius:12px; }
        .cart-remove { background:none; border:none; color:#c44; cursor:pointer; font-size:1.3rem; }
        .cart-total { font-size:1.3rem; font-weight:600; text-align:right; margin:1.3rem 0; }
        .cart-total span { color:var(--accent); font-size:1.7rem; }
        .cart-actions { display:flex; gap:1rem; justify-content:center; }
        .btn-outline { background:transparent; border:1.5px solid #c44; color:#c44; padding:0.7rem 2rem; border-radius:30px; cursor:pointer; font-weight:600; }
        .btn-primary { background:var(--accent); border:none; color:#fff; padding:0.7rem 2.5rem; border-radius:30px; cursor:pointer; font-weight:600; letter-spacing:2px; }
        footer { margin-top:auto; text-align:center; padding:2.5rem 0; font-size:0.9rem; color:#7a7a7a; border-top:1px solid rgba(0,0,0,0.05); }
        footer a { color:var(--accent); text-decoration:none; font-weight:600; }
        .notification { position:fixed; bottom:30px; right:30px; background:white; border-left:4px solid var(--accent); color:#2d2d2d; padding:14px 24px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.15); z-index:400; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    </style>
</head>
<body>
    <div class="welcome-overlay" id="welcomeScreen">
        <div class="welcome-content">
            <div class="welcome-logo">AMATIL <span>VAPE</span></div>
            <div class="welcome-text">ИСКУССТВО ПАРА</div>
            <button class="welcome-btn" id="enterBtn">ВОЙТИ</button>
        </div>
    </div>

    <div class="main-wrapper">
        <header>
            <div class="logo">AMATIL <span>VAPE</span></div>
            <nav class="nav-links">
                <a href="#">Девайсы</a>
                <a href="#shop">Жидкости</a>
                <a href="#contacts">Контакты</a>
                <button class="cart-icon" id="cartIcon">🛒<span id="cart-count">0</span></button>
            </nav>
        </header>

        <section class="hero">
            <h1>Дыши вкусом</h1>
            <div class="subtitle">премиальные устройства и жидкости</div>
            <a href="#shop" class="cta-button">Смотреть товары</a>
        </section>

        <section id="shop" class="products-section">
            <h2 class="section-title">Популярное</h2>
            <div class="product-grid" id="productGrid"></div>
        </section>

        <footer id="contacts">
            <p>📱 Связь: <a href="https://t.me/Fe3riko" target="_blank">Telegram @Fe3riko</a></p>
            <p>© 2025 AMATIL VAPE — только для совершеннолетних</p>
        </footer>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-dialog">
            <button class="cart-close" id="closeCart">&times;</button>
            <h2 class="cart-title">Корзина</h2>
            <div id="cartItemsContainer" class="cart-items"></div>
            <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
            <div class="cart-actions">
                <button class="btn-outline" id="clearCart">Очистить</button>
                <button class="btn-primary" id="checkoutBtn">Оформить</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Приветственный экран
            var welcomeScreen = document.getElementById('welcomeScreen');
            var enterBtn = document.getElementById('enterBtn');
            function hideWelcome() {
                welcomeScreen.classList.add('fade-out');
                setTimeout(function() { welcomeScreen.style.display = 'none'; }, 1200);
            }
            if (enterBtn) {
                enterBtn.addEventListener('click', hideWelcome);
                setTimeout(hideWelcome, 5000);
            } else {
                welcomeScreen.style.display = 'none';
            }

            // Товары
            var products = [
                { id: 'xros5', name: 'XROS 5', desc: 'Компактный под-мод с регулировкой обдува', price: 1089, img: 'https://i.ibb.co/9m5B5XrS/IMG-3071.jpg', stock: 1 },
                { id: 'liquid', name: 'ANNIMA LOVE & ZOMBI', desc: 'Мятный коктейль • 30 мл • 20 мг', price: 289, img: 'https://i.ibb.co/sdqBrBs5/IMG-3123.jpg', stock: 4 }
            ];

            var cart = JSON.parse(localStorage.getItem('amatil_cart_v3')) || [];
            if (JSON.parse(localStorage.getItem('amatil_order_confirmed'))) {
                cart = [];
                localStorage.removeItem('amatil_cart_v3');
                localStorage.setItem('amatil_order_confirmed', false);
            }

            function loadStock() {
                var saved = localStorage.getItem('amatil_stock_v3');
                if (saved) JSON.parse(saved).forEach(function(s) {
                    var prod = products.find(function(p) { return p.id === s.id; });
                    if (prod) prod.stock = s.stock;
                });
            }
            loadStock();
            function saveStock() { localStorage.setItem('amatil_stock_v3', JSON.stringify(products.map(function(p) { return { id: p.id, stock: p.stock }; }))); }
            function saveCart() { localStorage.setItem('amatil_cart_v3', JSON.stringify(cart)); }

            var cartModal = document.getElementById('cartModal');
            var cartItemsContainer = document.getElementById('cartItemsContainer');
            var cartTotalSpan = document.getElementById('cartTotal');
            var cartCountSpan = document.getElementById('cart-count');

            function updateUI() {
                var cards = document.querySelectorAll('.product-card');
                cards.forEach(function(card, i) {
                    if (i >= products.length) return;
                    var p = products[i];
                    var stockSpan = card.querySelector('.stock-info');
                    var btn = card.querySelector('.buy-btn');
                    if (stockSpan) stockSpan.textContent = 'В наличии: ' + p.stock + ' шт.';
                    if (btn) {
                        if (p.stock === 0) { btn.disabled = true; btn.textContent = 'НЕТ В НАЛИЧИИ'; }
                        else { btn.disabled = false; btn.textContent = 'В КОРЗИНУ'; }
                    }
                });
                cartCountSpan.textContent = cart.reduce(function(sum, item) { return sum + item.qty; }, 0);
                if (cartModal.classList.contains('open')) renderCartItems();
            }

            function renderCartItems() {
                cartItemsContainer.innerHTML = '';
                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = '<p style="text-align:center;color:#999;">Корзина пуста</p>';
                    cartTotalSpan.textContent = '0';
                    return;
                }
                var total = 0;
                cart.forEach(function(item) {
                    var prod = products.find(function(p) { return p.id === item.id; });
                    if (!prod) return;
                    total += prod.price * item.qty;
                    var div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = '<img src="' + prod.img + '" alt="' + prod.name + '"><div class="cart-item-info"><div class="cart-item-name">' + prod.name + '</div><div class="cart-item-price">' + prod.price + ' ₽</div></div><div class="cart-item-actions"><span class="cart-item-qty">x' + item.qty + '</span><button class="cart-remove" data-id="' + item.id + '">🗑️</button></div>';
                    cartItemsContainer.appendChild(div);
                });
                cartTotalSpan.textContent = total;
                document.querySelectorAll('.cart-remove').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        var id = e.currentTarget.getAttribute('data-id');
                        var idx = cart.findIndex(function(item) { return item.id === id; });
                        if (idx === -1) return;
                        var prod = products.find(function(p) { return p.id === id; });
                        if (prod) prod.stock += cart[idx].qty;
                        cart.splice(idx, 1);
                        saveStock();
                        saveCart();
                        updateUI();
                    });
                });
            }

            window.addToCart = function(id) {
                var prod = products.find(function(p) { return p.id === id; });
                if (!prod || prod.stock <= 0) return;
                prod.stock -= 1;
                var existing = cart.find(function(item) { return item.id === id; });
                if (existing) existing.qty += 1;
                else cart.push({ id: id, qty: 1 });
                saveStock();
                saveCart();
                updateUI();
                showNotification(prod.name + ' добавлен в корзину');
            };

            function clearCart() {
                cart.forEach(function(item) {
                    var prod = products.find(function(p) { return p.id === item.id; });
                    if (prod) prod.stock += item.qty;
                });
                cart = [];
                saveStock();
                saveCart();
                updateUI();
            }

            // НОВАЯ функция отправки заказа с подробными alert'ами
            function sendOrderToBot() {
                if (cart.length === 0) {
                    alert('🛑 Корзина пуста');
                    return;
                }
                var orderData = cart.map(function(item) {
                    var prod = products.find(function(p) { return p.id === item.id; });
                    return { name: prod.name, price: prod.price, qty: item.qty };
                });
                var total = orderData.reduce(function(sum, p) { return sum + p.price * p.qty; }, 0);
                var payload = JSON.stringify({ order: orderData, total: total, date: new Date().toISOString() });

                alert('📦 Данные для отправки:\n' + payload);

                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
                    alert('✅ Telegram WebApp обнаружен, отправляю...');
                    try {
                        window.Telegram.WebApp.sendData(payload);
                        alert('✅ Данные переданы в Telegram');
                    } catch (e) {
                        alert('❌ Ошибка при отправке:\n' + e.message);
                    }
                } else {
                    alert('❌ Ошибка: Telegram WebApp не найден.\n' +
                          'window.Telegram: ' + !!window.Telegram + '\n' +
                          'WebApp: ' + !!(window.Telegram && window.Telegram.WebApp) + '\n' +
                          'initData: ' + !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData));
                }
            }

            function showNotification(msg) {
                var n = document.createElement('div');
                n.className = 'notification';
                n.textContent = '✅ ' + msg;
                document.body.appendChild(n);
                setTimeout(function() { n.remove(); }, 2500);
            }

            document.getElementById('productGrid').innerHTML = products.map(function(p) {
                var disabled = p.stock === 0 ? 'disabled' : '';
                return '<div class="product-card"><img src="' + p.img + '" alt="' + p.name + '" class="product-img"><h3 class="product-name">' + p.name + '</h3><p class="product-desc">' + p.desc + '</p><div class="product-price">' + p.price + ' ₽</div><div class="stock-info">В наличии: ' + p.stock + ' шт.</div><button class="buy-btn" ' + disabled + ' onclick="addToCart(\'' + p.id + '\')">' + (p.stock === 0 ? 'НЕТ В НАЛИЧИИ' : 'В КОРЗИНУ') + '</button></div>';
            }).join('');

            document.getElementById('cartIcon').addEventListener('click', function() {
                cartModal.classList.add('open');
                renderCartItems();
            });
            document.getElementById('closeCart').addEventListener('click', function() {
                cartModal.classList.remove('open');
            });
            document.getElementById('clearCart').addEventListener('click', clearCart);
            document.getElementById('checkoutBtn').addEventListener('click', sendOrderToBot);
            window.addEventListener('click', function(e) {
                if (e.target === cartModal) cartModal.classList.remove('open');
            });

            updateUI();
        })();
    </script>
</body>
</html>
